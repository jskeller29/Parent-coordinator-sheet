<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include_('Styles') ?>
  <style>
    /* 🔍 Find a Family (owner 2026-11-23): a popup that can become a side panel (Menus.gs FIND A FAMILY) */
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .ff-top { padding: 12px 14px 6px; flex-shrink: 0; position: relative; z-index: 2; }
    .ff-mode { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 5px; }
    .ff-mode .hint { margin: 0; }
    .ff-body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .ff-body > * { flex-shrink: 0; }
    /* The search box and its list: the shared look (Styles.html SEARCH, owner 2026-11-24). The list floats over the
       page and closes on a pick, so the family card shows right under the box (it used to open under a list of up
       to 20 names, out of view: "the list stays and blocks everything"). Taller here: nothing else is under it. */
    #results { max-height: min(440px, calc(100vh - 140px)); }
    .fam { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
    .fam h3 { margin: 0 0 2px; }
    .meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
    .eyebrow2 { font: 700 11px var(--font); letter-spacing: .5px; text-transform: uppercase; color: var(--accent); margin: 10px 0 4px; }
    .par { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--panel); }
    .par:first-of-type { border-top: 0; padding-top: 2px; }
    .par .nums { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .tag { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 9px; padding: 0 7px; margin: 3px 4px 0 0; }
    .tag.y { background: var(--ok-soft); color: var(--ok); }
    .tag.n { background: var(--danger-soft); color: var(--danger); }
    .tag.g { background: var(--panel); color: var(--muted); }
    .fu { font-size: 12.5px; margin: 3px 0; }
    .fu .st { display: inline-block; background: var(--danger); color: #ffffff; border-radius: 9px; padding: 0 7px; font-weight: 600; font-size: 11px; margin-right: 4px; }
    .fu .st.w { background: var(--warn-soft); color: var(--warn); }
    .notes { white-space: pre-wrap; font-size: 12.5px; line-height: 1.45; max-height: 200px; overflow: hidden; position: relative; overflow-wrap: anywhere; }
    .notes.all { max-height: none; }
    .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .acts .btn { flex: 1; min-width: 120px; }
    .state { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13.5px; padding: 18px 0; justify-content: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="ff-top">
    <div id="searchWrap" class="searchbox">
      <label class="lab" for="q">Search a family</label>
      <input type="text" id="q" placeholder="Loading families…" autocomplete="off" disabled>
      <div id="results" class="results hidden" role="listbox" aria-label="Families found"></div>
    </div>
    <div class="ff-mode">
      <p class="hint" id="hint">Spelling doesn't have to be exact.</p>
      <button type="button" class="link" id="modeBtn" onclick="switchMode()">Open as side panel</button>
    </div>
  </div>
  <div class="ff-body" id="body">
    <div id="msg" class="notice hidden" role="status"></div>
    <div id="loading" class="state"><div class="spinner"></div>Loading the families…</div>
    <div id="startHint" class="state hidden">Pick a family from the list to see its parents, follow-ups and notes.</div>
    <div id="fam" class="fam hidden"></div>
  </div>

  <script>
    var DATA = null;        // getFindFamilyData()
    var BY = {};            // OSIS -> { st, parents: [] }
    var ENTRIES = [];       // what the search looks through
    var picked = null;      // the OSIS on show
    var mode = 'popup';     // 'popup' | 'panel'
    var busy = false;

    function $(id) { return document.getElementById(id); }
    function show(id, on) { $(id).classList.toggle('hidden', !on); }
    function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function say(text, kind) { $('msg').className = 'notice' + (kind ? ' ' + kind : ''); $('msg').textContent = text; show('msg', !!text); }
    function onFail(e) { busy = false; show('loading', false); say('Something went wrong: ' + (e && e.message ? e.message : e), 'err'); }

    // ---------- search ----------
    function plain(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
    function words(s) { return plain(s).replace(/[^a-z0-9@]+/g, ' ').trim().split(' ').filter(Boolean); }
    function digits(s) { return String(s || '').replace(/\D/g, ''); }
    // Edit distance, stopping once it is over max
    function dist(a, b, max) {
      if (Math.abs(a.length - b.length) > max) return max + 1;
      var prev = [], cur, i, j;
      for (j = 0; j <= b.length; j++) prev[j] = j;
      for (i = 1; i <= a.length; i++) {
        cur = [i]; var low = i;
        for (j = 1; j <= b.length; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          if (cur[j] < low) low = cur[j];
        }
        if (low > max) return max + 1;
        prev = cur;
      }
      return prev[b.length];
    }
    // How well one typed word fits a name part: exact 3, start of it 2.5, one or two letters off 1.5 / 1.2
    function fit(w, t) {
      if (t === w) return 3;
      if (t.indexOf(w) === 0) return 2.5;
      if (w.length < 4) return 0;
      var max = w.length >= 7 ? 2 : 1;
      if (dist(w, t, max) <= max) return 1.5;
      if (t.length > w.length && dist(w, t.slice(0, w.length), 1) <= 1) return 1.2;
      return 0;
    }
    function nameScore(ws, toks) {
      var total = 0;
      for (var i = 0; i < ws.length; i++) {
        var best = 0;
        for (var j = 0; j < toks.length; j++) best = Math.max(best, fit(ws[i], toks[j]));
        if (!best) return 0; // every typed word has to fit somewhere
        total += best;
      }
      return total;
    }
    function buildIndex() {
      BY = {}; ENTRIES = [];
      DATA.students.forEach(function (s) { BY[s.osis] = { st: s, parents: [] }; ENTRIES.push({ kind: 'student', osis: s.osis, toks: words(s.name), name: s.name }); });
      DATA.parents.forEach(function (p) {
        if (!BY[p.osis]) return;
        BY[p.osis].parents.push(p);
        ENTRIES.push({ kind: 'parent', osis: p.osis, toks: words(p.name), name: p.name, p: p, phones: p.phones.map(digits), email: plain(p.email) });
      });
    }
    // The query without a phone extension at its end ("x12", "ext. 12"): searching "(718) 555-0102 x12" finds the number
    function dropExtension(q) { return String(q).replace(/\s*(?:x|ext\.?|extension)\s*\d{1,6}\s*$/i, ''); }
    function search(q) {
      q = dropExtension(q);
      var qd = digits(q), qp = plain(q).trim();
      var hits = {}; // OSIS -> { score, why }
      var add = function (osis, score, why) { if (!hits[osis] || hits[osis].score < score) hits[osis] = { score: score, why: why }; };
      if (!qp) return [];
      var digitsOnly = qd.length >= 3 && qd.length >= qp.replace(/[\s()+.\-]/g, '').length;
      if (digitsOnly && qd.length === 11 && qd.charAt(0) === '1') qd = qd.slice(1); // +1 / 1- in front: the US country code
      if (digitsOnly) {
        ENTRIES.forEach(function (e) {
          if (e.kind === 'student' && e.osis.indexOf(qd) !== -1) add(e.osis, e.osis === qd ? 9 : 6, 'Student');
          if (e.kind === 'parent') e.phones.forEach(function (ph, i) {
            if (ph.indexOf(qd) !== -1) add(e.osis, ph === qd ? 9 : 7, 'Parent: ' + e.p.name + (e.p.rel ? ' · ' + e.p.rel : '') + ' · ' + e.p.phones[i]);
          });
        });
      } else if (qp.indexOf('@') !== -1) {
        ENTRIES.forEach(function (e) { if (e.kind === 'parent' && e.email && e.email.indexOf(qp) !== -1) add(e.osis, 8, 'Parent: ' + e.p.name + ' · ' + e.p.email); });
      } else {
        var ws = words(q);
        ENTRIES.forEach(function (e) {
          var sc = nameScore(ws, e.toks);
          if (!sc) return;
          if (e.kind === 'student') add(e.osis, sc + 0.1, 'Student');
          else add(e.osis, sc, 'Parent: ' + e.p.name + (e.p.rel ? ' · ' + e.p.rel : ''));
        });
      }
      return Object.keys(hits).map(function (o) { return { osis: o, score: hits[o].score, why: hits[o].why }; })
        .sort(function (a, b) { return b.score - a.score || BY[a.osis].st.name.localeCompare(BY[b.osis].st.name); });
    }
    var SHOW_RESULTS = 20; // the rest: "N more: type more of the name" (it showed 8 and never said there were more)
    function openList(on) { show('results', on); }
    function renderResults() {
      var q = $('q').value;
      if (!q.trim() || q === $('q').dataset.picked) { openList(false); return; }
      var all = search(q);
      var list = all.slice(0, SHOW_RESULTS);
      var more = all.length - list.length;
      var html = list.map(function (r) {
        var f = BY[r.osis], s = f.st;
        var sub = r.why === 'Student'
          ? 'Parent(s): ' + (f.parents.map(function (p) { return p.name; }).join(', ') || 'none listed') + (s.cls ? ' · Class ' + s.cls : '')
          : r.why;
        return '<button type="button" role="option" class="res' + (r.osis === picked ? ' on' : '') + '" data-osis="' + esc(r.osis) + '" onclick="pick(this.dataset.osis)">' +
          '<span class="nm">' + esc(s.name) + ' <span class="os">' + esc(s.osis) + '</span></span><span class="meta">' + esc(sub) + '</span></button>';
      }).join('');
      if (!list.length) html = '<div class="res-empty">Nobody found. Try part of the name, or the last 4 digits of the phone number.</div>';
      if (more > 0) html += '<div class="res-more">' + (more === 1 ? '1 more family' : more + ' more families') + ' match: type more of the name, or part of a phone number.</div>';
      $('results').innerHTML = html;
      $('results').scrollTop = 0;
      openList(true);
    }

    // ---------- the family card ----------
    var detailsFor = null;
    function pick(osis) {
      if (!BY[osis]) return;
      picked = osis;
      var s = BY[osis].st;
      // The box shows the family picked, like New / Edit Student (typing starts a new search: Styles.html SEARCH)
      $('q').value = $('q').dataset.picked = s.name + ' (' + s.osis + ')';
      openList(false);
      show('startHint', false);
      renderFamily(null);
      $('body').scrollTop = 0;
      $('q').focus();
      detailsFor = osis;
      google.script.run.withSuccessHandler(function (d) { if (detailsFor === osis) renderFamily(d); })
        .withFailureHandler(function (e) { if (detailsFor === osis) renderFamily({ error: e && e.message ? e.message : String(e) }); })
        .getFindFamilyDetails(osis);
    }
    function statusTag(label, text) {
      var t = String(text || '').trim();
      if (!t) return '';
      var yes = /^yes/i.test(t);
      return '<span class="tag ' + (yes ? 'y' : /^no/i.test(t) ? 'n' : 'g') + '">' + esc(label + ': ' + t) + '</span>';
    }
    function renderFamily(d) {
      var f = BY[picked];
      if (!f) { show('fam', false); return; }
      var s = f.st, html = '';
      html += '<h3>' + esc(s.name) + '</h3>';
      html += '<div class="meta">OSIS ' + esc(s.osis) + (s.cls ? ' · ' + esc(s.cls) : '') + (s.site ? ' · ' + esc(s.site) : '') +
        (s.sibling ? ' · sibling: ' + esc(s.sibling.replace(/\b\d{6,}\s*-\s*/g, '')) : '') + '</div>';
      html += '<div class="meta">' + (s.status && s.status !== 'Current' ? '<b>' + esc(s.status) + '</b> · ' : '') + 'Last contact: ' + esc(s.last || 'None logged') + '</div>';
      html += '<div class="eyebrow2">Parents</div>';
      if (!f.parents.length) html += '<div class="meta">No parents in the Parents List.</div>';
      f.parents.forEach(function (p, i) {
        html += '<div class="par"><b>' + esc(p.name) + '</b>' + (p.rel ? ' · ' + esc(p.rel) : '') + (p.lang && !/^english$/i.test(p.lang) ? ' · ' + esc(p.lang) : '') +
          '<div class="nums">' + esc(p.phones.join(' · ') || 'no phone') + (p.email ? ' · ' + esc(p.email) : '') + '</div>' +
          statusTag('Parent Square', p.ps) + statusTag('NYCSA', p.nycsa) + '</div>';
      });
      if (!d) {
        html += '<div class="state"><div class="spinner"></div>Loading notes…</div>';
      } else if (d.error) {
        html += '<div class="notice err" style="margin-top:8px">' + esc(d.error) + '</div>';
      } else {
        if (d.followUps && d.followUps.length) {
          html += '<div class="eyebrow2">Open follow-up' + (d.followUps.length > 1 ? 's' : '') + '</div>';
          d.followUps.forEach(function (u) {
            html += '<div class="fu"><span class="st' + (/asap/i.test(u.status) ? '' : ' w') + '">' + esc(u.status) + '</span>' + esc(u.date) +
              (u.text ? ' · ' + esc(u.text) : '') + (u.more ? '<div class="meta">' + esc(u.more) + '</div>' : '') + '</div>';
          });
        }
        if (d.info && d.info.length) {
          html += '<div class="eyebrow2">Student Info</div>';
          d.info.forEach(function (x) { html += '<div class="meta" style="color:var(--ink)">' + (x.who ? '<b>' + esc(x.who) + ':</b> ' : '') + esc(x.line) + '</div>'; });
        }
        html += '<div class="eyebrow2">Notes</div>';
        html += d.notes ? '<div class="notes" id="notes">' + esc(d.notes) + '</div><button type="button" class="link hidden" id="moreNotes" onclick="allNotes()">Show all notes</button>'
                        : '<div class="meta">No notes yet.</div>';
      }
      // Logging a contact from here comes with the logging UI (a future update, owner 2026-11-23)
      html += '<div class="acts"><button type="button" class="btn sec" onclick="editStudent()">Edit student</button></div>';
      $('fam').innerHTML = html;
      show('fam', true);
      var n = $('notes');
      if (n && n.scrollHeight > n.clientHeight + 4) show('moreNotes', true);
    }
    function allNotes() { $('notes').classList.add('all'); show('moreNotes', false); }

    // ---------- actions ----------
    function editStudent() {
      if (!picked || busy) return;
      busy = true;
      google.script.run.withSuccessHandler(function () { setTimeout(function () { busy = false; }, 1500); })
        .withFailureHandler(onFail).findFamilyEditStudent(picked);
    }
    function switchMode() {
      var other = mode === 'panel' ? 'popup' : 'panel';
      $('modeBtn').disabled = true;
      google.script.run.withSuccessHandler(function () { google.script.host.close(); })
        .withFailureHandler(function (e) { $('modeBtn').disabled = false; onFail(e); })
        .findFamilySwitch(other, { q: $('q').value === $('q').dataset.picked ? '' : $('q').value, osis: picked || '' });
    }

    // ---------- start ----------
    var timer = null;
    $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(renderResults, 120); });
    // (↓ / ↑ / Enter / Escape, closing the list, typing after a pick: Styles.html SEARCH, the same on every page)
    // Clicking back in the box opens the list again for what is typed there
    $('q').addEventListener('click', function () { if ($('results').classList.contains('hidden')) renderResults(); });
    function start() {
      google.script.run.withSuccessHandler(function (data) {
        DATA = data || { students: [], parents: [] };
        mode = DATA.as === 'panel' ? 'panel' : 'popup';
        $('modeBtn').textContent = mode === 'panel' ? 'Open as popup' : 'Open as side panel';
        show('loading', false);
        if (DATA.notBuilt) { say('Build your sheets first (🚀 App Menu → 🏗️ Build Sheets Only), then search here.', 'warn'); return; }
        buildIndex();
        $('q').disabled = false;
        $('q').placeholder = 'Search student, parent, OSIS, phone or email…';
        if (DATA.keep && DATA.keep.osis && BY[DATA.keep.osis]) { pick(DATA.keep.osis); return; }
        show('startHint', true);
        if (DATA.keep && DATA.keep.q) $('q').value = DATA.keep.q;
        renderResults();
        $('q').focus();
      }).withFailureHandler(onFail).getFindFamilyData();
    }
    start();
  </script>
</body>
</html>
