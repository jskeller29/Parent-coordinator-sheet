<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include_('Styles') ?>
  <style>
    body { padding: 16px; }
    .stack { gap: 18px; }
    .picker { display: flex; gap: 6px; }
    .picker select { flex: 1; min-width: 0; }
    .picker .btn { width: 36px; padding: 0; font-size: 18px; line-height: 1; }
    .why { font-size: 12.5px; color: var(--muted); margin-top: 6px; min-height: 2.8em; }
    .sample { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .sample .hd { background: #073763; color: #ffffff; font-weight: 700; font-size: 12px; padding: 6px 10px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .sample .rw { padding: 7px 10px; font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 8px; border-top: 1px solid var(--line); }
    .sample .rw:nth-child(odd) { background: var(--panel); }
    .sample .num { font-variant-numeric: tabular-nums; text-align: right; }
    .sample .glyphs { padding: 7px 10px; font-size: 15px; letter-spacing: .04em; border-top: 1px solid var(--line); color: var(--muted); }
    .status { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; min-height: 18px; }
    .status.warn { color: var(--warn); }
    .status.ok { color: var(--ok); }
    .grp { display: flex; flex-direction: column; gap: 8px; }
    .grp .cbx { font-size: 13.5px; }
    .grp .cbx .help { display: block; margin-top: 1px; }
    .others { max-height: 170px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .others .cbx { font-size: 13px; }
    .others .hid { color: var(--faint); font-size: 11.5px; margin-left: 4px; }
    .row-btns { display: flex; gap: 8px; }
    .row-btns .btn { flex: 1; }
    .now { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  </style>
</head>
<body>
  <div class="stack">

    <div>
      <label class="lab" for="font">Font</label>
      <div class="picker">
        <button type="button" class="btn sec" id="prevBtn" title="Previous font (←)" aria-label="Previous font">‹</button>
        <select id="font"></select>
        <button type="button" class="btn sec" id="nextBtn" title="Next font (→)" aria-label="Next font">›</button>
      </div>
      <div class="why" id="why"></div>
    </div>

    <div class="sample" id="sample" aria-label="Sample">
      <div class="hd"><span>Student / Guardian</span><span>OSIS</span></div>
      <div class="rw"><span>Rivera, Mateo · 3-302</span><span class="num">231874560</span></div>
      <div class="rw"><span>Ana Rivera (Mother)</span><span class="num">(718) 555-0142</span></div>
      <div class="rw"><span>Okafor, Amara · K-012</span><span class="num">240018732</span></div>
      <div class="glyphs">Il1 O0 rn m 5S 8B 11/04/2026</div>
    </div>

    <div>
      <label class="cbx" for="live"><input type="checkbox" id="live" checked><span>Show it on the tab I have open as I go</span></label>
      <div class="status" id="status" style="margin-top:8px"></div>
      <div class="row-btns" style="margin-top:8px">
        <button type="button" class="btn sec" id="showHereBtn">Show on this tab</button>
        <button type="button" class="btn sec" id="undoBtn">Undo preview</button>
      </div>
    </div>

    <div class="grp">
      <div class="eyebrow">Apply to</div>
      <label class="cbx" for="applyBuilt"><input type="checkbox" id="applyBuilt" checked><span>Built tabs<span class="help" id="builtList"></span></span></label>
      <label class="cbx" for="applyContactLog"><input type="checkbox" id="applyContactLog" checked><span>Contact Log</span></label>
      <div>
        <span class="lab" style="font-weight:600;font-size:13px">Other tabs</span>
        <div class="others" id="others"><span class="hint">Loading…</span></div>
      </div>
      <label class="cbx" for="applyTheme"><input type="checkbox" id="applyTheme" checked><span>Also make it the spreadsheet's default font<span class="help">For new tabs and cells nobody has set a font on.</span></span></label>
    </div>

    <div class="row-btns">
      <button type="button" class="btn pri" id="applyBtn">Apply</button>
    </div>

    <div class="now">
      <div id="nowFonts">Loading…</div>
      <button type="button" class="link" id="resetBtn" style="margin-top:6px">Back to the original fonts</button>
    </div>
  </div>

  <script>
    // Recommended first, then the rest. Web-safe fonts need no download in the sidebar.
    const FONTS = {
      rec: [
        ['Roboto', "Google's own font. Narrow, so more fits in each column, and the numbers are easy to read."],
        ['Source Sans 3', 'Matches the pop-ups and sidebars. Clean and a little warmer than Roboto.'],
        ['IBM Plex Sans', 'Very clear letters and numbers, a bit more formal.'],
        ['Atkinson Hyperlegible', 'Made for easy reading: 1, l and I or 0 and O are hard to mix up.'],
        ['Lato', 'Friendly and rounded, still compact.'],
        ['Montserrat', 'What the built tabs use today. Wide, so columns need more room.']
      ],
      rest: ['Arial', 'Inter', 'Open Sans', 'Noto Sans', 'Nunito Sans', 'Work Sans', 'Public Sans', 'Libre Franklin',
             'Fira Sans', 'PT Sans', 'Barlow', 'Roboto Condensed', 'Roboto Mono', 'Verdana', 'Trebuchet MS',
             'Georgia', 'Merriweather', 'Lora', 'Source Serif 4', 'Times New Roman']
    };
    const WEB_SAFE = ['Arial', 'Verdana', 'Trebuchet MS', 'Georgia', 'Times New Roman'];
    const WHY = {};
    FONTS.rec.forEach(f => WHY[f[0]] = f[1]);

    const el = id => document.getElementById(id);
    const sel = el('font');
    FONTS.rec.forEach(f => sel.add(new Option(f[0], f[0])));
    { const line = new Option('────────────', ''); line.disabled = true; sel.add(line); }
    FONTS.rest.forEach(n => sel.add(new Option(n, n)));
    const ORDER = FONTS.rec.map(f => f[0]).concat(FONTS.rest);

    const loaded = {};
    function loadFont(name) {
      if (WEB_SAFE.indexOf(name) !== -1 || loaded[name]) return;
      loaded[name] = true;
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + name.replace(/ /g, '+') + ':wght@400;700&display=swap';
      document.head.appendChild(l);
    }

    function setStatus(text, cls, busy) {
      const s = el('status');
      s.className = 'status' + (cls ? ' ' + cls : '');
      s.innerHTML = '';
      if (busy) { const sp = document.createElement('div'); sp.className = 'spinner'; s.appendChild(sp); }
      const t = document.createElement('span'); t.textContent = text; s.appendChild(t);
    }

    // ---------- choosing a font ----------
    function showFont() {
      const name = sel.value;
      loadFont(name);
      el('sample').style.fontFamily = '"' + name + '", Arial, sans-serif';
      el('why').textContent = WHY[name] || 'Not on the recommended list. If the sheet shows Arial instead, Sheets doesn\'t have this font.';
      if (el('live').checked) schedulePreview();
    }
    function step(delta) {
      let i = ORDER.indexOf(sel.value) + delta;
      if (i < 0) i = ORDER.length - 1;
      if (i >= ORDER.length) i = 0;
      sel.value = ORDER[i];
      showFont();
    }
    sel.addEventListener('change', showFont);
    el('prevBtn').addEventListener('click', () => step(-1));
    el('nextBtn').addEventListener('click', () => step(1));
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    });

    // ---------- live preview (one call at a time; the latest choice wins) ----------
    let timer = null, busy = false, pending = false;
    function schedulePreview() {
      clearTimeout(timer);
      timer = setTimeout(runPreview, 350);
    }
    function runPreview() {
      if (busy) { pending = true; return; }
      busy = true;
      const font = sel.value;
      setStatus('Showing ' + font + '…', '', true);
      google.script.run
        .withSuccessHandler(res => {
          busy = false;
          if (res.ok) setStatus('Showing ' + font + ' on "' + res.tab + '". Open another tab and click "Show on this tab" to see it there. Nothing is saved until you click Apply.');
          else setStatus('"' + res.tab + '": ' + res.msg, 'warn');
          if (pending) { pending = false; runPreview(); }
        })
        .withFailureHandler(err => { busy = false; setStatus('Preview failed: ' + err.message, 'warn'); })
        .zf_preview(font);
    }
    el('showHereBtn').addEventListener('click', runPreview);
    el('live').addEventListener('change', () => { if (el('live').checked) runPreview(); });

    el('undoBtn').addEventListener('click', () => {
      setStatus('Putting the old fonts back…', '', true);
      google.script.run
        .withSuccessHandler(tabs => setStatus(tabs.length ? 'Put back: ' + tabs.join(', ') + '.' : 'Nothing to undo.', 'ok'))
        .withFailureHandler(err => setStatus('Undo failed: ' + err.message, 'warn'))
        .zf_undoPreview();
    });

    // ---------- apply ----------
    function checkedOthers() {
      return Array.prototype.slice.call(document.querySelectorAll('#others input:checked')).map(i => i.value);
    }
    el('applyBtn').addEventListener('click', () => {
      const font = sel.value;
      const opts = { built: el('applyBuilt').checked, contactLog: el('applyContactLog').checked, tabs: checkedOthers(), theme: el('applyTheme').checked };
      if (!opts.built && !opts.contactLog && !opts.tabs.length && !opts.theme) { setStatus('Tick at least one tab under "Apply to".', 'warn'); return; }
      if (!confirm('Change the font to ' + font + ' on the tabs you ticked?\n\nThe whole tab changes, including headers.')) return;
      el('applyBtn').disabled = true;
      setStatus('Applying ' + font + '…', '', true);
      google.script.run
        .withSuccessHandler(res => {
          el('applyBtn').disabled = false;
          let msg = res.applied.length ? font + ' is now on: ' + res.applied.join(', ') + '.' : 'No tabs changed.';
          if (res.restored.length) msg += ' Preview undone on: ' + res.restored.join(', ') + '.';
          if (res.themeNote) msg += ' ' + res.themeNote;
          setStatus(msg, res.themeNote ? 'warn' : 'ok');
          loadState(true);
        })
        .withFailureHandler(err => { el('applyBtn').disabled = false; setStatus('Apply failed: ' + err.message, 'warn'); })
        .zf_apply(font, opts);
    });

    el('resetBtn').addEventListener('click', () => {
      if (!confirm('Put the built tabs back to Montserrat and the Contact Log back to Roboto?')) return;
      setStatus('Putting the original fonts back…', '', true);
      google.script.run
        .withSuccessHandler(() => { setStatus('The built tabs use Montserrat and the Contact Log uses Roboto again.', 'ok'); loadState(true); })
        .withFailureHandler(err => setStatus('Reset failed: ' + err.message, 'warn'))
        .zf_resetDefaults();
    });

    // ---------- start ----------
    function loadState(keepFont) {
      google.script.run.withSuccessHandler(state => {
        el('builtList').textContent = state.built.join(', ') || 'None found';
        el('applyBuilt').disabled = !state.built.length;
        el('applyContactLog').disabled = !state.hasContactLog;

        const box = el('others');
        const ticked = checkedOthers();
        box.innerHTML = '';
        if (!state.others.length) box.innerHTML = '<span class="hint">No other tabs.</span>';
        state.others.forEach(t => {
          const label = document.createElement('label'); label.className = 'cbx';
          const input = document.createElement('input'); input.type = 'checkbox'; input.value = t.name; input.checked = ticked.indexOf(t.name) !== -1;
          const span = document.createElement('span'); span.textContent = t.name;
          if (t.hidden) { const h = document.createElement('span'); h.className = 'hid'; h.textContent = 'hidden'; span.appendChild(h); }
          label.appendChild(input); label.appendChild(span); box.appendChild(label);
        });

        el('nowFonts').textContent = 'Now: built tabs use ' + state.fonts.built + ', Contact Log uses ' + state.fonts.contactLog + '.';
        if (!keepFont) {
          sel.value = ORDER.indexOf(state.fonts.built) !== -1 ? state.fonts.built : 'Roboto';
          if (state.previewing.length) setStatus('A preview is still showing on: ' + state.previewing.join(', ') + '. Undo it or apply a font.', 'warn');
          el('live').checked = false; // don't change the open tab just by opening the tool
          showFont();
          el('live').checked = true;
        }
      }).zf_getState();
    }
    loadState(false);
  </script>
</body>
</html>
