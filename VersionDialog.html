<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include_('Styles') ?>
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .header { padding: 6px 22px 12px; display: flex; flex-direction: column; gap: 4px; }
    .sub { font-size: 13.5px; color: var(--muted); }
    .changelog > * { flex-shrink: 0; }
    .changelog { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 14px; display: flex; flex-direction: column; gap: 16px; }
    .entry { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .entry-top, .older-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .ver { font: 600 16px/1.3 var(--font-head); }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
    .badge.major { background: var(--danger-soft); color: var(--danger); }
    .badge.small { background: var(--accent-soft); color: var(--accent); }
    .notes { font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
    .getlink { align-self: flex-start; margin-top: 4px; }
    .howto { font-size: 13px; line-height: 1.5; color: var(--muted); }
    .howto ol { margin: 4px 0 0; padding-left: 20px; }
    .older { display: flex; flex-direction: column; gap: 6px; }
    .older-head { border-bottom: 1px solid var(--line); padding-bottom: 5px; }
    .older-title { font-size: 13.5px; font-weight: 700; color: var(--muted); }
    .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13.5px; padding: 10px 0; }
    .errorbox { padding: 12px 14px; }
    .errorbox b { display: block; margin-bottom: 4px; }
    .errorbox p { font-size: 12.5px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
    .footer { border-top: 1px solid var(--line); padding: 12px 22px 14px; display: flex; flex-direction: column; gap: 10px; }
    .pref { display: flex; align-items: center; gap: 9px; font-size: 13.5px; cursor: pointer; user-select: none; }
    .pref input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .saved { font-size: 12px; color: var(--ok); font-weight: 600; opacity: 0; transition: opacity .3s; }
    .saved.show { opacity: 1; }
    .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
    .footer .hint { text-align: right; }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="mainTitle">A new version is available</h1>
    <p class="sub" id="subtitle">Checking the Version Tracker…</p>
  </div>

  <div class="changelog" id="changelog">
    <div class="loading"><div class="spinner"></div><span>Loading the changelog…</span></div>
  </div>

  <div class="footer">
    <label class="pref">
      <input type="checkbox" id="majorsOnly" onchange="savePref()">
      <span>Only tell me about <b>Major</b> updates automatically</span>
      <span class="saved" id="savedMajors">Saved</span>
    </label>
    <label class="pref">
      <input type="checkbox" id="dismissForever" onchange="saveForever()">
      <span>Stop <b>automatic</b> update checks</span>
      <span class="saved" id="savedForever">Saved</span>
    </label>
    <div class="btn-row">
      <button id="dismissNowBtn" class="btn sec" onclick="dismissForNow()">Dismiss for now</button>
      <button id="dismissBtn" class="btn pri" onclick="dismissUpdate()">Dismiss this update</button>
    </div>
    <p class="hint">You can always check yourself: 🚀 App Menu → 🔔 Check for Updates (shows all updates)</p>
  </div>

  <script>
    // No template tags in this file — the dialog PULLS its data from the
    // server (vc_getPayload in VersionCheck.gs) right after it loads. That
    // makes it immune to copy/paste template mangling, and any failure
    // shows a readable error instead of a blank panel.
    let DATA = null;

    // ==========================================
    // HELPERS
    // ==========================================
    function makeBadge(size) {
      const isMajor = String(size || '').trim().toLowerCase().indexOf('major') === 0;
      const badge = document.createElement('span');
      badge.className = 'badge ' + (isMajor ? 'major' : 'small');
      badge.textContent = isMajor ? 'Major' : 'Small';
      return badge;
    }

    function makeNotes(text) {
      const notes = document.createElement('p');
      notes.className = 'notes';
      notes.textContent = text || '(No notes provided)';
      return notes;
    }

    function showErrorBox(title, detail) {
      const list = document.getElementById('changelog');
      list.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'errorbox notice err';
      const b = document.createElement('b');
      b.textContent = title;
      const p = document.createElement('p');
      p.textContent = detail;
      box.appendChild(b);
      box.appendChild(p);
      list.appendChild(box);
      document.getElementById('subtitle').textContent = 'Something went wrong loading the changelog.';
    }

    // ==========================================
    // RENDER
    // ==========================================
    function render() {
      document.getElementById('subtitle').textContent =
        "Your version is dated " + DATA.installedDateStr + " — here's everything you've missed:";
      document.getElementById('majorsOnly').checked = !!DATA.majorsOnly;
      document.getElementById('dismissForever').checked = !!DATA.dismissForever;

      const list = document.getElementById('changelog');
      list.innerHTML = '';

      if (!DATA.entries || DATA.entries.length === 0) {
        document.getElementById('mainTitle').textContent = "You're up to date";
        document.getElementById('subtitle').textContent =
          "You're already caught up! Change your notification preference below anytime.";
        const card = document.createElement('div');
        card.className = 'entry';
        card.appendChild(makeNotes('No new updates to show — you can close this window.'));
        list.appendChild(card);
        return;
      }

      // ---- HERO CARD: the newest release, with the ONE link ----
      const newest = DATA.entries[0];
      const card = document.createElement('div');
      card.className = 'entry';

      const top = document.createElement('div');
      top.className = 'entry-top';
      const ver = document.createElement('span');
      ver.className = 'ver';
      ver.textContent = 'Update ' + newest.dateStr;
      top.appendChild(ver);
      top.appendChild(makeBadge(newest.size));
      card.appendChild(top);
      card.appendChild(makeNotes(newest.notes));

      // Single button — always points at the latest template
      if (DATA.latestLink) {
        const a = document.createElement('a');
        a.className = 'getlink btn pri';
        a.href = DATA.latestLink;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'Get the latest version';
        card.appendChild(a);
        // How an update works (2026-11-13): a new copy, then this tracker's data is brought into it
        const how = document.createElement('div');
        how.className = 'howto';
        how.innerHTML = '<b>How to update</b><ol>' +
          '<li>Click Get the latest version and make the copy.</li>' +
          '<li>In the new copy: 🚀 App Menu → 🚨 Initial Setup.</li>' +
          '<li>When it asks "Is this your first PC Tracker?", choose "No, bring over last year\'s tracker" (it works in the middle of the year too), pick this tracker and click Bring it over.</li>' +
          '<li>When it is done, this tracker\'s nightly rebuild and phone sync pause by themselves. The next time you open this tracker, it asks whether to keep it paused: click Yes.</li>' +
          '</ol>';
        card.appendChild(how);
      }
      list.appendChild(card);

      // ---- OLDER MISSED VERSIONS: plain changelog sections, no links ----
      DATA.entries.slice(1).forEach(function(e) {
        const sec = document.createElement('div');
        sec.className = 'older';

        const head = document.createElement('div');
        head.className = 'older-head';
        const title = document.createElement('span');
        title.className = 'older-title';
        title.textContent = 'Update ' + e.dateStr + ' Changelog';
        head.appendChild(title);
        head.appendChild(makeBadge(e.size));
        sec.appendChild(head);

        sec.appendChild(makeNotes(e.notes));
        list.appendChild(sec);
      });
    }

    // ==========================================
    // ACTIONS
    // ==========================================
    function lockButtons(locked) {
      document.getElementById('dismissBtn').disabled = locked;
      document.getElementById('dismissNowBtn').disabled = locked;
    }

    function flashSaved(tagId) {
      const tag = document.getElementById(tagId);
      tag.classList.add('show');
      setTimeout(function() { tag.classList.remove('show'); }, 1500);
    }

    // "Dismiss for now": just closes — the update pops again on the next check.
    function dismissForNow() {
      google.script.host.close();
    }

    // "Dismiss this update": marks the newest version as "seen" so it won't pop
    // again until something newer ships, then closes.
    function dismissUpdate() {
      if (!DATA) { google.script.host.close(); return; }
      lockButtons(true);
      google.script.run
        .withSuccessHandler(function() { google.script.host.close(); })
        .withFailureHandler(function() { lockButtons(false); })
        .vc_dismiss(DATA.newestDateMs);
    }

    // Saves the Majors-only (auto-notify) preference instantly on toggle
    function savePref() {
      const on = document.getElementById('majorsOnly').checked;
      google.script.run
        .withSuccessHandler(function() { flashSaved('savedMajors'); })
        .vc_setMajorsOnly(on);
    }

    // Toggles automatic (on-open) update checks. Manual checks always work.
    function saveForever() {
      const on = document.getElementById('dismissForever').checked;
      google.script.run
        .withSuccessHandler(function() { flashSaved('savedForever'); })
        .vc_setDismissForever(on);
    }

    // ==========================================
    // BOOT — pull the changelog from the server
    // ==========================================
    function boot() {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showErrorBox('Preview mode',
          'This dialog only works inside Google Sheets. Open it from the sheet via 🚀 App Menu → 🔔 Check for Updates.');
        return;
      }

      google.script.run
        .withSuccessHandler(function(jsonStr) {
          if (!jsonStr) {
            showErrorBox('Could not reach the Version Tracker',
              'The tracker sheet could not be read. Check your internet connection, or the tracker may have been moved or unshared.');
            return;
          }
          try {
            DATA = JSON.parse(jsonStr);
          } catch (err) {
            showErrorBox('Could not read the changelog data',
              String(err && err.message ? err.message : err));
            return;
          }
          render();
        })
        .withFailureHandler(function(err) {
          showErrorBox('Server error while loading the changelog',
            String(err && err.message ? err.message : err) +
            '\n\nIf this mentions an unknown function (like vc_getPayload), the Menus script is out of date: re-paste the latest Menus and VersionDialog files.');
        })
        .vc_getPayload();
    }

    boot();
  </script>
</body>
</html>
