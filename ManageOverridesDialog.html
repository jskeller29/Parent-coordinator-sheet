<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include_('Styles') ?>
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .ov-body > * { flex-shrink: 0; }
    .ov-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
    #list { display: flex; flex-direction: column; gap: 10px; }
    .ovc { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .ovc-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .ovc .nm { font-weight: 700; font-size: 15px; }
    .ovc .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .ovc-bot { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    .ovc .acts { display: flex; gap: 6px; }
    .state { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 32px 0; color: var(--muted); font-size: 13.5px; }
    .state.err { color: var(--danger); }
    .empty { text-align: center; padding: 36px 16px; border: 1px dashed var(--line); border-radius: var(--radius); }
    .empty p + p { margin-top: 4px; }
  </style>
</head>
<body>
  <div class="ov-body">
    <p class="help" style="margin:0">View, edit or delete any manual student change. Deleting an entry puts the student's ATS data back.</p>

    <div id="loading" class="state"><div class="spinner"></div>Loading your entries…</div>

    <div id="list"></div>
  </div>

  <div class="dfoot">
    <span class="sp"></span>
    <button type="button" class="btn sec" onclick="closeDialog()">Close</button>
  </div>

  <script>
    window.onload = function() {
       if (typeof google !== 'undefined' && google.script && google.script.run) {
           google.script.run.withSuccessHandler(renderList).getOverridesList();
       } else {
           // Local test fallback
           renderList([
               {lastName: "Simpson", firstName: "Bart", osis: "123456789", classCode: "Y41", type: "Edit Existing Student", date: "05/12/2026"}
           ]);
       }
    }

    function renderList(overrides) {
        document.getElementById('loading').style.display = 'none';
        const list = document.getElementById('list');
        
        if(overrides.length === 0) {
            list.innerHTML = `
            <div class="empty">
                <p style="font-weight:600">No manual changes yet.</p>
                <p class="help">Students you add or edit from the menu will show up here.</p>
            </div>`;
            return;
        }

        let html = '';
        overrides.forEach(o => {
            const pillClass = o.type.includes("New") ? "pill new" : "pill";

            html += `
            <div class="ovc">
               <div class="ovc-top">
                 <div>
                   <div class="nm">${o.lastName}, ${o.firstName}</div>
                   <div class="meta">OSIS ${o.osis} · Class ${o.classCode}</div>
                 </div>
                 <span class="${pillClass}">${o.type}</span>
               </div>
               <div class="ovc-bot">
                 <span class="hint">Changed ${o.date}</span>
                 <div class="acts">
                   <button onclick="editOsis('${o.osis}')" class="btn sec sm">Edit</button>
                   <button onclick="deleteOsis('${o.osis}', '${o.firstName}')" class="btn dgr sm">Delete</button>
                 </div>
               </div>
            </div>`;
        });
        list.innerHTML = html;
    }

    function editOsis(osis) {
        document.getElementById('list').innerHTML = '<div class="state"><div class="spinner"></div>Opening the editor…</div>';
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            // Tells the backend to save the OSIS, close this screen, and open the edit screen!
            google.script.run.withSuccessHandler(() => google.script.host.close()).setPrefillAndOpenEdit(osis);
        }
    }

    function deleteOsis(osis, firstName) {
        if(!confirm(`Are you sure you want to permanently delete the override for ${firstName}?\n\nIf they are a standard ATS student, their data will revert to the default ATS information.`)) return;
        
        document.getElementById('list').innerHTML = '<div class="state err"><div class="spinner"></div>Deleting the entry and rebuilding…</div>';
        
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(() => {
                // Refresh the list seamlessly after deletion
                document.getElementById('list').innerHTML = '<div class="state"><div class="spinner"></div>Refreshing…</div>';
                google.script.run.withSuccessHandler(renderList).getOverridesList();
            }).deleteOverride(osis);
        }
    }

    function closeDialog() {
       if (typeof google !== 'undefined' && google.script && google.script.host) {
          google.script.host.close();
       }
    }
  </script>
</body>
</html>
