<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include_('Styles') ?>
    <style>
      body { padding: 16px; }
      .stack { gap: 18px; }
      .grp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
      .grp-head .eyebrow span { text-transform: none; letter-spacing: 0; font-weight: 400; }
      .grp-head .time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

      .cl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
      .cl li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
      .cl li.todo { color: var(--muted); }
      .cl li.now { font-weight: 600; }
      .cl li.fail { color: var(--danger); font-weight: 600; }
      .ck { width: 17px; height: 17px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; font: 700 10px/1 var(--font); margin-top: 1px; color: #ffffff; }
      .cl li.done .ck { background: var(--accent); }
      .cl li.now .ck { border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 1s linear infinite; }
      .cl li.todo .ck { border: 1.5px solid var(--line); }
      .cl li.fail .ck { background: var(--danger); }
      .cl li .sub { display: none; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 1px; }
      .cl li.now .sub, .cl li.fail .sub { display: block; }
      .build-intro { font-size: 12px; color: var(--muted); margin: -2px 0 10px; }

      .bar { height: 8px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
      .bar.waiting i { width: 0; }
      .bar.done i { background: var(--ok); }
      .bar.cancelled i { background: var(--danger); }
      .sync-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 2px 0 6px; font-size: 13.5px; }
      .sync-top b { font-weight: 600; }
      .sync-top span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .status { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
      .status.ok { color: var(--ok); font-weight: 600; }
      .status.err { color: var(--danger); font-weight: 600; }
      .eta { font-size: 12.5px; color: var(--ink); margin-top: 3px; font-variant-numeric: tabular-nums; }
      .safe-note { font-size: 12px; color: var(--muted); margin-top: 6px; }

      .rep .rh { padding: 9px 11px; font-weight: 600; font-size: 13px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .rep a { display: flex; justify-content: space-between; gap: 8px; padding: 8px 11px; font-size: 13px; color: var(--ink); text-decoration: none; cursor: pointer; }
      .rep a:hover { background: var(--panel); }
      .rep a + a { border-top: 1px solid var(--line); }
      .rep a b { font-variant-numeric: tabular-nums; }
      .rep a b::after { content: " \203A"; color: var(--muted); font-weight: 400; }
      .rep .rhint { font-size: 11.5px; color: var(--muted); padding: 6px 11px 0; }

      .control-panel { display: none; gap: 8px; }
      .control-panel .btn { flex: 1; }

      #detailsView { display: none; }
      .back-btn { margin-bottom: 12px; font-size: 13.5px; }
      #detailsTitle { margin-bottom: 10px; }
      .log-list { list-style: none; padding: 0; margin: 0; font-size: 13px; border: 1px solid var(--line); border-radius: var(--radius); }
      .log-item { padding: 8px 10px 8px 24px; position: relative; line-height: 1.4; }
      .log-item + .log-item { border-top: 1px solid var(--line); }
      .log-item::before { content: ""; position: absolute; left: 10px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
      .log-item.created::before { background: var(--ok); }
      .log-item.edited::before { background: #b7791f; }
      .log-item.deleted::before { background: var(--danger); }
      .log-item.upgrade::before { background: var(--accent); }
      .log-item.empty { padding-left: 10px; color: var(--muted); }
      .log-item.empty::before { display: none; }
    </style>
  </head>
  <body>

    <div id="mainView" class="stack">

      <div id="buildSection">
        <div class="grp-head"><div class="eyebrow" id="buildHead">Build sheets</div><div class="time" id="buildTime"></div></div>
        <p class="build-intro">Rebuilds every generated tab from Raw Data (ATS), the Contact Log, Events and your Student Overrides.</p>
        <ul class="cl" id="stepList"></ul>
        <div id="buildStatus" class="status">Waiting to start…</div>
      </div>

      <div id="syncSection">
        <div class="grp-head"><div class="eyebrow">Sync phones</div></div>
        <div class="sync-top"><b>Google Contacts</b><span id="syncCount"></span></div>
        <div class="bar waiting" id="syncBar"><i id="syncFill"></i></div>
        <div id="syncStatus" class="status">Starts after the build.</div>
        <div id="etaText" class="eta"></div>
        <div class="safe-note">You can close this panel. The sync keeps running in the background.</div>
      </div>

      <div id="buildReport"></div>
      <div id="summaryReport"></div>

      <div id="controlPanel" class="control-panel">
        <button id="btnRestart" class="btn sec" onclick="triggerRestart()">Restart run</button>
        <button id="btnCancel" class="btn dgr" onclick="triggerCancel()">Cancel run</button>
        <button id="btnStart" class="btn pri" style="display: none;" onclick="triggerRestart()">Start new build</button>
      </div>
    </div>

    <div id="detailsView">
      <button class="link back-btn" onclick="showMainView()">‹ Back to summary</button>
      <h2 id="detailsTitle">Log details</h2>
      <ul id="logList" class="log-list"></ul>
    </div>

    <script>
      let poller;
      let cachedLogData = null;
      let cachedBuildLogData = null;
      let runMode = 'FULL_SYNC';
      let buildReportShown = false;

      // --- ETA VARIABLES ---
      let syncStartTime = null;
      let syncStartProgress = null;
      let pauseStartTime = null;
      let totalPauseTime = 0;
      let lastCalculatedProgress = null;
      let estimatedMsRemaining = 0;
      let lastUpdateTime = null;

      // --- BUILD STEPS ---
      // The server sends the real list (BUILD_STEPS in Build.gs) and the current step
      // with every status poll; this copy only fills the list before the first poll.
      let STEPS = [
        { label: "Reading your data", detail: "" },
        { label: "Student List", detail: "" },
        { label: "Event Log", detail: "" },
        { label: "Combined Contact Tracking", detail: "" },
        { label: "Parents Divided", detail: "" },
        { label: "Directory", detail: "" },
        { label: "Phone Contacts", detail: "" },
        { label: "Finishing up", detail: "" }
      ];
      let buildStartTime = null;
      let buildEndTime = null;
      let lastStepIndex = -1;
      let lastPhase = null;

      function el(id) { return document.getElementById(id); }

      function renderStepList() {
        const list = el('stepList');
        list.innerHTML = '';
        STEPS.forEach(function(s, i) {
          const li = document.createElement('li');
          li.id = 'step-' + i;
          li.className = 'todo';
          const ck = document.createElement('span'); ck.className = 'ck';
          const label = document.createElement('span');
          label.textContent = s.label;
          if (s.detail) {
            const sub = document.createElement('span'); sub.className = 'sub'; sub.textContent = s.detail;
            label.appendChild(sub);
          }
          li.appendChild(ck); li.appendChild(label);
          list.appendChild(li);
        });
      }

      // done = steps before `current`; `current` is running (or failed); -1 = nothing yet; STEPS.length = all done
      function setSteps(current, failed) {
        STEPS.forEach(function(s, i) {
          const li = el('step-' + i);
          const ck = li.querySelector('.ck');
          let cls = i < current ? 'done' : (i === current ? (failed ? 'fail' : 'now') : 'todo');
          li.className = cls;
          ck.textContent = cls === 'done' ? '✓' : (cls === 'fail' ? '✕' : '');
        });
      }

      function fmtClock(ms) {
        const s = Math.max(0, Math.floor(ms / 1000));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return m + ':' + (r < 10 ? '0' + r : r);
      }

      function showBuildTime() {
        if (!buildStartTime) { el('buildTime').textContent = ''; return; }
        const end = buildEndTime || Date.now();
        el('buildTime').textContent = (buildEndTime ? 'done in ' : '') + fmtClock(end - buildStartTime);
      }

      function markBuildDone() {
        setSteps(STEPS.length);
        if (buildStartTime && !buildEndTime) buildEndTime = Date.now();
        showBuildTime();
        el('buildStatus').className = 'status ok';
        el('buildStatus').innerText = 'Sheets built';
      }

      function setSyncBar(progress, total, cls) {
        const pct = total > 0 ? Math.min(100, Math.round(progress / total * 100)) : 0;
        el('syncFill').style.width = pct + '%';
        el('syncBar').className = 'bar' + (cls ? ' ' + cls : '');
        el('syncCount').textContent = total > 0 ? progress + ' of ' + total : '';
      }

      function showControls(running) {
        el('controlPanel').style.display = 'flex';
        el('btnRestart').style.display = running ? 'inline-flex' : 'none';
        el('btnCancel').style.display = running ? 'inline-flex' : 'none';
        el('btnStart').style.display = running ? 'none' : 'inline-flex';
        el('btnStart').innerText = runMode === 'BUILD_ONLY' ? 'Start new build' : 'Start new run';
      }

      window.onload = function() {
        renderStepList();

        // Show the last build report if you reopen the sidebar
        google.script.run.withSuccessHandler(data => {
            if (data && (data.newStudents.length > 0 || data.discharged.length > 0 || data.nycsaUpgrades.length > 0 || data.psUpgrades.length > 0)) {
                cachedBuildLogData = data;
                if (lastPhase !== 'building') {
                    showBuildReport();
                    buildReportShown = true;
                }
            }
        }).getBuildLogData();

        google.script.run.withSuccessHandler(mode => {
           runMode = mode;
           if (runMode === 'BUILD_ONLY') {
              el('syncSection').style.display = 'none';
              google.script.run.withFailureHandler(onFailure).startBuildOnlyProcess();
           } else {
              google.script.run.withFailureHandler(onFailure).startResilientSync();
           }
           poller = setInterval(pollServer, 1500);
        }).getRunMode();
      };

      function pollServer() {
        google.script.run.withSuccessHandler(updateUI).getSyncStatus();
      }

      function updateUI(state) {
        if (!state || state.phase === 'idle') return;
        const prevPhase = lastPhase;
        lastPhase = state.phase;

        // Use the server's step list (labels + one-line details) once it arrives
        if (state.buildSteps && state.buildSteps.length && STEPS !== state.buildSteps &&
            JSON.stringify(STEPS) !== JSON.stringify(state.buildSteps)) {
          STEPS = state.buildSteps;
          renderStepList();
          setSteps(lastStepIndex);
        }

        if (['building', 'syncing', 'paused', 'quota'].includes(state.phase)) {
          showControls(true);
        }

        if (state.phase === 'building') {
          if (prevPhase !== 'building') { buildStartTime = Date.now(); buildEndTime = null; }
          let idx = Math.min(Math.max(Number(state.buildStep) || 0, 0), STEPS.length - 1);
          lastStepIndex = idx;
          setSteps(idx);
          showBuildTime();
          el('buildStatus').className = 'status';
          el('buildStatus').innerText = 'Building sheets…';
          el('syncStatus').className = 'status';
          el('syncStatus').innerText = 'Starts after the build.';
          // Clear the old report while a new build runs
          el('buildReport').innerHTML = '';
          buildReportShown = false;
        }

        if (state.phase === 'done_build_only') {
          clearInterval(poller);
          markBuildDone();
          if (!buildReportShown) { showBuildReport(); buildReportShown = true; }
          showControls(false);
          google.script.run.resetSyncStatus();
          return;
        }

        // Show the build report while the phone sync runs
        if (['syncing', 'paused', 'quota'].includes(state.phase)) {
          markBuildDone();
          if (!buildReportShown) {
              showBuildReport();
              buildReportShown = true;
          }

          if (state.phase === 'syncing') {
              setSyncBar(state.progress, state.total);
              el('syncStatus').className = 'status';
              el('syncStatus').innerText = 'Syncing contacts…';

              if (pauseStartTime) {
                  totalPauseTime += (Date.now() - pauseStartTime);
                  pauseStartTime = null;
              }

              if (!syncStartTime || syncStartProgress === null || state.progress < syncStartProgress) {
                  syncStartTime = Date.now();
                  syncStartProgress = state.progress;
                  totalPauseTime = 0;
                  lastCalculatedProgress = state.progress;
                  estimatedMsRemaining = 0;
                  lastUpdateTime = Date.now();
                  el('etaText').innerText = "Working out the time left…";
              } else {
                  if (state.progress > lastCalculatedProgress) {
                      let rowsDone = state.progress - syncStartProgress;
                      let trueElapsedMs = (Date.now() - syncStartTime) - totalPauseTime;
                      if (trueElapsedMs < 0) trueElapsedMs = 0;

                      let msPerRow = trueElapsedMs / rowsDone;
                      let rowsLeft = state.total - state.progress;

                      estimatedMsRemaining = rowsLeft * msPerRow;
                      lastCalculatedProgress = state.progress;
                      lastUpdateTime = Date.now();
                  }

                  if (estimatedMsRemaining > 0) {
                      let timeSinceLastUpdate = Date.now() - lastUpdateTime;
                      let currentDisplayMs = estimatedMsRemaining - timeSinceLastUpdate;
                      if (currentDisplayMs < 0) currentDisplayMs = 0;

                      let totalSeconds = Math.floor(currentDisplayMs / 1000);
                      let hours = Math.floor(totalSeconds / 3600);
                      let minutes = Math.floor((totalSeconds % 3600) / 60);
                      let seconds = totalSeconds % 60;

                      let secStr = seconds < 10 ? "0" + seconds : seconds;
                      let minStr = (hours > 0 && minutes < 10) ? "0" + minutes : minutes;

                      let timeString = hours > 0 ? `${hours}h ${minStr}m ${secStr}s` : `${minutes}m ${secStr}s`;
                      el('etaText').innerText = `About ${timeString} left`;
                  }
              }
          }

          if (state.phase === 'paused') {
            if (!pauseStartTime) pauseStartTime = Date.now();
            setSyncBar(state.progress, state.total);
            el('syncStatus').className = 'status';
            el('syncStatus').innerText = `Large batch: pausing 60 seconds to protect the server. Resuming at ${state.progress}…`;
            el('etaText').innerText = "Paused. The timer is stopped.";
          }

          if (state.phase === 'quota') {
            if (!pauseStartTime) pauseStartTime = Date.now();
            setSyncBar(state.progress, state.total);
            el('syncStatus').className = 'status';
            el('syncStatus').innerText = `Google's limit was reached. Pausing 15 minutes. Resuming at ${state.progress}…`;
            el('etaText').innerText = "Paused. The timer is stopped.";
          }
        }

        if (state.phase === 'killed') {
          clearInterval(poller);
          const wasBuilding = prevPhase === 'building' || prevPhase === null;

          // A crash is reported as 'killed' with the error attached; only a real Cancel has no error
          let cancelText = runMode === 'BUILD_ONLY' ? 'Build cancelled' : 'Sync cancelled';
          if (state.error) {
            cancelText = (runMode === 'BUILD_ONLY' ? 'Build failed: ' : 'Sync failed: ') + String(state.error);
          }

          if (wasBuilding && lastStepIndex >= 0) setSteps(lastStepIndex, true);
          if (runMode === 'BUILD_ONLY') {
             el('buildStatus').className = 'status err';
             el('buildStatus').innerText = cancelText;
          } else {
             el('syncBar').classList.add('cancelled');
             el('syncStatus').className = 'status err';
             el('syncStatus').innerText = cancelText;
          }
          el('etaText').innerText = "";

          showControls(false);
          google.script.run.resetSyncStatus();
          return;
        }

        if (state.phase === 'done') {
          clearInterval(poller);
          markBuildDone();
          setSyncBar(state.total, state.total, 'done');
          // A row that couldn't be saved, or a skipped removal (over half), is said here
          el('syncStatus').className = state.note || state.failed ? 'status err' : 'status ok';
          el('syncStatus').innerText = 'Sync complete' + (state.note ? '. ' + state.note : '');
          el('etaText').innerText = "";

          if (!buildReportShown) { showBuildReport(); buildReportShown = true; }
          showFinalReport(state.created, state.deleted, state.edited, state.failed);

          showControls(false);
          google.script.run.resetSyncStatus();
        }
      }

      function showBuildReport() {
        el('buildReport').innerHTML = `
          <div class="box rep" id="buildSummaryBox">
            <div class="rh">Build report</div>
            <div id="buildReportLinks"><div class="rhint">Loading…</div></div>
          </div>
        `;
        if (cachedBuildLogData) {
            renderBuildLinks(cachedBuildLogData);
        } else {
            google.script.run.withSuccessHandler(data => {
                cachedBuildLogData = data;
                renderBuildLinks(data);
            }).getBuildLogData();
        }
      }

      function renderBuildLinks(data) {
          el('buildReportLinks').innerHTML = `
              <a onclick="openBuildDetails('newStudents')">New students<b>${data.newStudents ? data.newStudents.length : 0}</b></a>
              <a onclick="openBuildDetails('discharged')">Discharged<b>${data.discharged ? data.discharged.length : 0}</b></a>
              <a onclick="openBuildDetails('nycsaUpgrades')">NYCSA upgrades<b>${data.nycsaUpgrades ? data.nycsaUpgrades.length : 0}</b></a>
              <a onclick="openBuildDetails('psUpgrades')">Parent Square upgrades<b>${data.psUpgrades ? data.psUpgrades.length : 0}</b></a>
          `;
      }

      function triggerCancel() {
        el('syncStatus').className = 'status';
        el('syncStatus').innerText = 'Cancelling background tasks…';
        if (runMode === 'BUILD_ONLY') el('buildStatus').innerText = 'Cancelling…';
        google.script.run.EMERGENCY_STOP_SYNC();
      }

      function triggerRestart() {
        el('controlPanel').style.display = 'none';
        setSteps(-1);
        lastStepIndex = -1;
        lastPhase = null;
        buildStartTime = null;
        buildEndTime = null;
        showBuildTime();
        setSyncBar(0, 0, 'waiting');
        el('buildStatus').className = 'status';
        el('buildStatus').innerText = 'Starting…';
        el('syncStatus').className = 'status';
        el('syncStatus').innerText = 'Starts after the build.';
        el('summaryReport').innerHTML = '';
        el('buildReport').innerHTML = '';

        el('etaText').innerText = "";
        syncStartTime = null;
        syncStartProgress = null;
        pauseStartTime = null;
        totalPauseTime = 0;
        lastCalculatedProgress = null;
        estimatedMsRemaining = 0;
        lastUpdateTime = null;
        cachedLogData = null;
        cachedBuildLogData = null;

        buildReportShown = false;

        clearInterval(poller);
        poller = setInterval(pollServer, 1500);

        if (runMode === 'BUILD_ONLY') {
            google.script.run.startBuildOnlyProcess();
        } else {
            google.script.run.RESTART_SYNC();
        }
      }

      function onFailure(error) {
        el('buildStatus').className = 'status err';
        el('buildStatus').innerText = 'Error: ' + error.message;
      }

      function showFinalReport(created, deleted, edited, failed) {
        el('summaryReport').innerHTML = `
          <div class="box rep">
            <div class="rh">Phone sync report</div>
            <a onclick="openDetails('created')">New contacts<b>${created || 0}</b></a>
            <a onclick="openDetails('edited')">Edited contacts<b>${edited || 0}</b></a>
            <a onclick="openDetails('deleted')">Old contacts removed<b>${deleted || 0}</b></a>
            ${failed ? `<a onclick="openDetails('failed')">Not saved (kept as they were)<b>${failed}</b></a>` : ''}
          </div>
        `;
      }

      function openBuildDetails(type) {
        el('mainView').style.display = 'none';
        el('detailsView').style.display = 'block';
        renderBuildLogList(type);
      }

      function openDetails(type) {
        el('mainView').style.display = 'none';
        el('detailsView').style.display = 'block';

        if (!cachedLogData) {
           el('detailsTitle').innerText = "Loading…";
           el('logList').innerHTML = "<li class='log-item empty'>Fetching logs from the server…</li>";

           google.script.run.withSuccessHandler(data => {
               cachedLogData = data;
               renderLogList(type);
           }).getSyncLogData();
        } else {
           renderLogList(type);
        }
      }

      function fillList(titleStr, arr, cssClass) {
        el('detailsTitle').innerText = titleStr;
        const listEl = el('logList');
        listEl.innerHTML = "";
        if (arr.length === 0) {
            listEl.innerHTML = "<li class='log-item empty'>Nothing in this list.</li>";
            return;
        }
        arr.forEach(item => {
           let li = document.createElement('li');
           li.className = `log-item ${cssClass}`;
           li.innerHTML = item;
           listEl.appendChild(li);
        });
      }

      function renderBuildLogList(type) {
        let arr = cachedBuildLogData ? (cachedBuildLogData[type] || []) : [];
        let titleStr = "";
        let cssClass = "upgrade";
        if (type === 'newStudents') { titleStr = "New students"; cssClass = "created"; }
        if (type === 'discharged') { titleStr = "Discharged students"; cssClass = "deleted"; }
        if (type === 'nycsaUpgrades') { titleStr = "NYCSA upgrades"; }
        if (type === 'psUpgrades') { titleStr = "Parent Square upgrades"; }
        fillList(titleStr, arr, cssClass);
      }

      function renderLogList(type) {
        let arr = cachedLogData[type] || [];
        let titleStr = "";
        let cssClass = "";
        if (type === 'created') { titleStr = "New contacts"; cssClass = "created"; }
        if (type === 'edited') { titleStr = "Edited contacts"; cssClass = "edited"; }
        if (type === 'deleted') { titleStr = "Old contacts removed"; cssClass = "deleted"; }
        if (type === 'failed') { titleStr = "Not saved this time"; cssClass = "deleted"; }
        fillList(titleStr, arr, cssClass);
      }

      function showMainView() {
        el('detailsView').style.display = 'none';
        el('mainView').style.display = 'flex';
      }
    </script>
  </body>
</html>
